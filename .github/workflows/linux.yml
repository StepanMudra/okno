name: Linux build
on:
  push:
    branches: [pc]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: make -f Makefile.pc
      - run: |
          mkdir -p okno-linux
          cp okno okno-linux/
          cp README.md okno-linux/
          tar czf okno-linux-x86_64.tar.gz okno-linux
      - uses: actions/upload-artifact@v4
        with:
          name: okno-linux-x86_64
          path: okno-linux-x86_64.tar.gz
